<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Business Cards — Studio Review</title>
  <style>
    :root {
      --bg: #0f0e0d;
      --surface: #181614;
      --border: #2a2622;
      --text: #ece6dc;
      --muted: #9a9186;
      --accent: #c8a26a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 24px;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    .back {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .back:hover { text-decoration: underline; }
    h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }
    p { color: var(--muted); line-height: 1.6; }
    .empty {
      margin-top: 32px;
      padding: 36px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 10px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../index.html">← Back to all review areas</a>
    <h1>Business Cards</h1>
    <p>Drop HTML options or a gallery here and run <code>./publish.sh</code> to share.</p>
    <div class="empty">No business card rounds uploaded yet.</div>
  </div>
</body>
</html>
