<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Epochurian — 13 (02 Upgraded: Gallery Print Norman)</title>
  <link rel="stylesheet" href="assets/brand.css">
  <style>
    .poster-13 {
      background-color: var(--sandstone-light);
      color: var(--bg-primary);
      padding: 16mm 18mm 14mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 0.5mm solid rgba(14, 13, 12, 0.22);
      padding-bottom: 4mm;
      margin-bottom: 7mm;
    }
    .gallery-header .wordmark {
      font-family: var(--font-heading);
      font-size: 30pt;
      letter-spacing: 0.22em;
      color: var(--bg-primary);
    }
    .gallery-header .tagline {
      font-family: var(--font-tagline);
      font-size: 32pt;
      color: #8c6d46;
      line-height: 1;
    }

    /* Artwork + Exhibit Caption tightly bound to the photo */
    .artwork-block {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      margin-bottom: 8mm;
    }
    .artwork-frame {
      flex: 1;
      min-height: 0;
      background: #ffffff;
      padding: 5.5mm;
      box-shadow: 0 18px 45px rgba(14, 13, 12, 0.12);
      border: 0.4mm solid rgba(14, 13, 12, 0.12);
      display: flex;
      flex-direction: column;
    }
    .artwork-img-wrap {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .artwork-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 42%;
      display: block;
    }
    .plate-caption {
      padding-top: 3.5mm;
      font-family: var(--font-sans);
      font-size: 13pt;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6b5335;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 2-Metre Signage Headline & Footer */
    .placard {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9mm;
      align-items: end;
      border-top: 0.5mm solid rgba(14, 13, 12, 0.22);
      padding-top: 6mm;
    }
    .placard h1 {
      font-family: var(--font-heading);
      font-size: 40pt;
      line-height: 1.06;
      letter-spacing: 0.02em;
      color: var(--bg-primary);
      text-transform: uppercase;
      margin-bottom: 4mm;
    }
    .placard-copy {
      font-family: var(--font-body);
      font-size: 17.5pt;
      line-height: 1.35;
      color: #2c2825;
      max-width: 190mm;
      margin-bottom: 5mm;
    }
    .placard-meta {
      font-family: var(--font-sans);
      font-size: 18.5pt;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bg-primary);
    }
    .placard-meta .handle {
      color: #8c6d46;
      margin-left: 4mm;
      font-weight: 500;
    }

    .seal-qr {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2mm;
      padding: 2mm;
      border: 0.4mm solid rgba(14, 13, 12, 0.22);
      background: #f5f1ed;
    }
    .seal-qr img {
      width: 36mm;
      height: 36mm;
      display: block;
    }
    .seal-qr span {
      font-family: var(--font-sans);
      font-size: 10pt;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--bg-primary);
    }
  </style>
</head>
<body>
<div class="poster poster-13">
  <header class="gallery-header">
    <div class="wordmark">EPOCHURIAN</div>
    <div class="tagline">Taste History</div>
  </header>

  <section class="artwork-block">
    <div class="artwork-frame">
      <div class="artwork-img-wrap">
        <img src="assets/images/norman-dessert-table.webp" alt="Anglo-Norman spit-roasted duck with spiced wine jus over Bayeux Tapestry">
      </div>
      <div class="plate-caption">
        <span>Plate I &bull; Anglo-Norman Court, 1066</span>
        <span>London Private Dining</span>
      </div>
    </div>
  </section>

  <footer class="placard">
    <div>
      <h1>You don’t need a time machine.<br>Just a dining table.</h1>
      <p class="placard-copy">
        Historical banquets cooked and narrated in your home — or our N10 garden.
      </p>
      <div class="placard-meta">
        epochurian.com <span class="handle">@epochurian</span>
      </div>
    </div>

    <div class="seal-qr">
      <img src="assets/qr-web-dark.svg" alt="QR Code to epochurian.com">
      <span>View Menus</span>
    </div>
  </footer>
</div>
</body>
</html>
