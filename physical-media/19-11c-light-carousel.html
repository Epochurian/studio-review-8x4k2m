<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Epochurian — 19 (11C: Light Horizontal Carousel)</title>
  <link rel="stylesheet" href="assets/brand.css">
  <style>
    .poster-19 {
      background: var(--sandstone-light);
      color: var(--bg-primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15mm 18mm 14mm;
    }

    .top-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5mm solid var(--bg-primary);
      padding-bottom: 3.5mm;
    }
    .top-strip .brand {
      font-family: var(--font-display);
      font-size: 22pt;
      letter-spacing: 0.3em;
      color: var(--bg-primary);
    }
    .top-strip .loc {
      font-family: var(--font-sans);
      font-size: 13pt;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6b5335;
    }

    /* Horizontal Carousel Bar */
    .carousel-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4mm;
      margin: 6mm 0 5mm;
    }
    .carousel-item {
      border-top: 0.5mm solid rgba(14, 13, 12, 0.22);
      padding-top: 3mm;
      opacity: 0.45;
    }
    .carousel-item.active {
      border-top: 1.4mm solid #8c693e;
      opacity: 1;
    }
    .carousel-year {
      font-family: var(--font-display);
      font-size: 36pt;
      line-height: 0.95;
      color: var(--bg-primary);
    }
    .carousel-city {
      margin-top: 1.5mm;
      font-family: var(--font-sans);
      font-size: 11pt;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6b5335;
    }

    /* Centered Big Square Photo */
    .center-square-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 5mm;
    }
    .square-card {
      height: 100%;
      aspect-ratio: 1 / 1;
      max-width: 100%;
      background: #ffffff;
      border: 0.45mm solid rgba(14, 13, 12, 0.25);
      padding: 4.5mm;
      box-shadow: 0 18px 45px rgba(14, 13, 12, 0.12);
      display: flex;
      flex-direction: column;
    }
    .square-img {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .square-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }
    .square-meta {
      padding-top: 3mm;
      display: flex;
      justify-content: space-between;
      font-family: var(--font-sans);
      font-size: 12.5pt;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #4f463e;
    }

    .bottom-block {
      border-top: 0.5mm solid var(--bg-primary);
      padding-top: 5.5mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 7mm;
    }
    .bottom-hook h1 {
      font-family: var(--font-display);
      font-size: 48pt;
      line-height: 0.96;
      text-transform: uppercase;
      color: var(--bg-primary);
    }
    .bottom-hook h1 span {
      color: #8c693e;
    }
    .bottom-hook p {
      margin-top: 3mm;
      font-family: var(--font-editorial);
      font-size: 18pt;
      color: #2f2a26;
    }

    .qr-wrap {
      display: flex;
      align-items: center;
      gap: 4.5mm;
      flex-shrink: 0;
    }
    .qr-wrap .txt {
      text-align: right;
      font-family: var(--font-sans);
    }
    .qr-wrap .txt .url {
      font-size: 18pt;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bg-primary);
    }
    .qr-wrap .txt .ig {
      font-size: 14pt;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: #6b5335;
      margin-top: 1.5mm;
    }
    .qr-wrap .qr {
      width: 30mm;
      height: 30mm;
      padding: 1.5mm;
      border: 0.4mm solid rgba(14, 13, 12, 0.28);
      background: #ffffff;
    }
    .qr-wrap .qr img {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="poster poster-19">
    <header class="top-strip">
      <div class="brand">EPOCHURIAN</div>
      <div class="loc">Private Banquets · London</div>
    </header>

    <nav class="carousel-bar" aria-label="Historical Settings">
      <div class="carousel-item">
        <div class="carousel-year">1066</div>
        <div class="carousel-city">Normandy</div>
      </div>
      <div class="carousel-item">
        <div class="carousel-year">1420</div>
        <div class="carousel-city">Florence</div>
      </div>
      <div class="carousel-item">
        <div class="carousel-year">1519</div>
        <div class="carousel-city">Tenochtitlan</div>
      </div>
      <div class="carousel-item active">
        <div class="carousel-year">1840</div>
        <div class="carousel-city">St. Petersburg</div>
      </div>
    </nav>

    <main class="center-square-wrap">
      <div class="square-card">
        <div class="square-img">
          <img src="assets/images/russia.jpg" alt="1840 St. Petersburg poached plum with burnt sugar shards on gold cloth">
        </div>
        <div class="square-meta">
          <span>1840 St. Petersburg</span>
          <span>Poached Plum &amp; Burnt Sugar</span>
        </div>
      </div>
    </main>

    <footer class="bottom-block">
      <div class="bottom-hook">
        <h1>Pick a Setting.<br><span>We’ll Do the Rest.</span></h1>
        <p>Historical tasting banquets in your London home or our N10 garden.</p>
      </div>
      <div class="qr-wrap">
        <div class="txt">
          <div class="url">epochurian.com</div>
          <div class="ig">@epochurian</div>
        </div>
        <div class="qr">
          <img src="assets/qr-web-dark.svg" alt="Scan for epochurian.com">
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
