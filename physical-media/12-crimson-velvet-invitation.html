<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Epochurian — 12 Crimson Royal Playbill</title>
  <link rel="stylesheet" href="assets/brand.css">
  <style>
    .poster-12 {
      background: radial-gradient(circle at 50% 42%, #3a0d12 0%, #1d0609 58%, #0e0405 100%);
      color: var(--sandstone-light);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18mm 20mm 15mm;
    }

    /* Ornate double gold playbill border */
    .outer-rule {
      position: absolute;
      inset: 8mm;
      border: 0.5mm solid rgba(212, 175, 127, 0.55);
      pointer-events: none;
    }
    .inner-rule {
      position: absolute;
      inset: 10.5mm;
      border: 0.25mm solid rgba(212, 175, 127, 0.3);
      pointer-events: none;
    }

    /* Playbill Header */
    .playbill-top {
      position: relative;
      z-index: 2;
      text-align: center;
    }
    .playbill-top .eyebrow {
      font-family: var(--font-sans);
      font-size: 8.5pt;
      font-weight: 600;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--gold-hover);
      margin-bottom: 3mm;
    }
    .playbill-top .brand {
      font-family: var(--font-display);
      font-size: 40pt;
      letter-spacing: 0.26em;
      color: var(--sandstone-light);
      padding-left: 0.26em;
      line-height: 1;
    }

    /* Dramatic Arch / Oval-Topped Stage Frame */
    .stage-arch {
      position: relative;
      z-index: 2;
      flex: 1;
      margin: 7mm 10mm;
      border-radius: 130mm 130mm 4mm 4mm;
      border: 0.6mm solid var(--gold-hover);
      overflow: hidden;
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.72);
      min-height: 0;
    }
    .stage-arch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 45%;
      display: block;
    }
    .arch-glow {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(14, 4, 5, 0.15) 0%,
        rgba(14, 4, 5, 0) 35%,
        rgba(14, 4, 5, 0.55) 100%
      );
      pointer-events: none;
    }

    /* Centerpiece Playbill Headline */
    .playbill-headline {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 6mm;
    }
    .playbill-headline h1 {
      font-family: var(--font-display);
      font-size: 38pt;
      line-height: 1.02;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--sandstone-light);
    }
    .playbill-headline h1 .gold {
      color: var(--gold-hover);
    }
    .playbill-headline .sub {
      margin-top: 3mm;
      font-family: var(--font-script);
      font-size: 26pt;
      color: var(--gold-hover);
      line-height: 1;
    }

    /* Bottom Royal Command Footer */
    .playbill-footer {
      position: relative;
      z-index: 2;
      border-top: 0.35mm solid rgba(212, 175, 127, 0.45);
      padding-top: 5mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-left {
      font-family: var(--font-sans);
    }
    .footer-left .venue {
      font-size: 9pt;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--sandstone-light);
    }
    .footer-left .note {
      font-size: 8pt;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 1.5mm;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 4.5mm;
    }
    .footer-right .links {
      text-align: right;
      font-family: var(--font-sans);
    }
    .footer-right .links .url {
      font-size: 10.5pt;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sandstone-light);
    }
    .footer-right .links .ig {
      font-size: 8.5pt;
      letter-spacing: 0.18em;
      color: var(--gold-hover);
      margin-top: 1mm;
    }
    .footer-right .qr {
      width: 20mm;
      height: 20mm;
      padding: 1.2mm;
      border: 0.35mm solid rgba(212, 175, 127, 0.55);
      background: rgba(14, 4, 5, 0.9);
    }
    .footer-right .qr img {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="poster poster-12">
    <div class="outer-rule"></div>
    <div class="inner-rule"></div>

    <header class="playbill-top">
      <div class="eyebrow">By Private Command · London</div>
      <div class="brand">EPOCHURIAN</div>
    </header>

    <div class="stage-arch">
      <img src="assets/images/norman-christmas-hero.webp" alt="Silver spoon pouring ruby wine jus over Norman pastry on Bayeux Tapestry">
      <div class="arch-glow"></div>
    </div>

    <section class="playbill-headline">
      <h1>One Night Only.<br><span class="gold">Every Course a Century.</span></h1>
      <div class="sub">Taste History</div>
    </section>

    <footer class="playbill-footer">
      <div class="footer-left">
        <div class="venue">Your Dining Room · Or Our N10 Garden</div>
        <div class="note">Private Historical Banquets for 6 to 18 Guests</div>
      </div>
      <div class="footer-right">
        <div class="links">
          <div class="url">epochurian.com</div>
          <div class="ig">@epochurian</div>
        </div>
        <div class="qr">
          <img src="assets/qr-web-gold.svg" alt="Scan to visit epochurian.com">
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
