<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Epochurian — 15 (08 Upgraded: British Museum Limestone Aztec)</title>
  <link rel="stylesheet" href="assets/brand.css">
  <style>
    .poster-15 {
      background: var(--sandstone-light);
      color: var(--bg-primary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15mm 18mm 14mm;
    }

    .limestone-border {
      position: absolute;
      inset: 7.5mm;
      border: 0.45mm solid rgba(14, 13, 12, 0.24);
      pointer-events: none;
    }

    /* Top museum gallery bar */
    .top-bar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5mm solid var(--bg-primary);
      padding-bottom: 3.5mm;
    }
    .top-bar .wordmark {
      font-family: var(--font-display);
      font-size: 30pt;
      letter-spacing: 0.26em;
      color: var(--bg-primary);
    }
    .top-bar .gallery-tag {
      font-family: var(--font-sans);
      font-size: 13pt;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6b5335;
    }

    /* Bold 2-Metre Headline */
    .headline-zone {
      position: relative;
      z-index: 2;
      padding: 6mm 0 5mm;
      text-align: left;
    }
    .headline-zone h1 {
      font-family: var(--font-display);
      font-size: 64pt;
      line-height: 0.94;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--bg-primary);
    }
    .headline-zone h1 .accent {
      color: #8c693e;
    }
    .headline-zone .deck {
      margin-top: 3.5mm;
      font-family: var(--font-editorial);
      font-size: 20pt;
      line-height: 1.25;
      color: #2f2a26;
      max-width: 220mm;
    }

    /* Showy Museum-Matted Plate with Larger Exhibit Caption */
    .plate-frame {
      position: relative;
      z-index: 2;
      flex: 1;
      border: 0.45mm solid rgba(14, 13, 12, 0.25);
      padding: 4.5mm;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .plate-img-wrap {
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }
    .plate-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }
    .plate-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 3.5mm;
      font-family: var(--font-sans);
      font-size: 13pt;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #4f463e;
    }

    /* Bottom Exhibition Placard Footer */
    .bottom-placard {
      position: relative;
      z-index: 2;
      margin-top: 5.5mm;
      border-top: 0.5mm solid var(--bg-primary);
      padding-top: 5mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .placard-info .script-sub {
      font-family: var(--font-script);
      font-size: 38pt;
      color: #8c693e;
      line-height: 1;
      margin-bottom: 1.5mm;
    }
    .placard-info .details {
      font-family: var(--font-sans);
      font-size: 13pt;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--bg-primary);
    }
    .qr-cluster {
      display: flex;
      align-items: center;
      gap: 4.5mm;
    }
    .qr-cluster .links {
      text-align: right;
      font-family: var(--font-sans);
    }
    .qr-cluster .links .site {
      font-size: 21pt;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--bg-primary);
    }
    .qr-cluster .links .handle {
      font-size: 16pt;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: #6b5335;
      margin-top: 1.2mm;
    }
    .qr-cluster .qr {
      width: 36mm;
      height: 36mm;
      border: 0.4mm solid rgba(14, 13, 12, 0.24);
      padding: 1mm;
      background: #f5f1ed;
    }
    .qr-cluster .qr img {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="poster poster-15">
    <div class="limestone-border"></div>

    <header class="top-bar">
      <div class="wordmark">EPOCHURIAN</div>
      <div class="gallery-tag">Private Dining · London</div>
    </header>

    <section class="headline-zone">
      <h1>An Exhibition<br><span class="accent">You Can Eat.</span></h1>
      <p class="deck">Six-course historical banquets cooked live in your dining room — or our N10 garden.</p>
    </section>

    <figure class="plate-frame">
      <div class="plate-img-wrap">
        <img src="assets/images/age-of-discovery-card.webp" alt="Mesoamerican roasted feast on crimson woven cloth">
      </div>
      <figcaption class="plate-label">
        <span>Plate IV · Tenochtitlan, 1519</span>
        <span>Charred Maize · Pepita · Heritage Duck</span>
      </figcaption>
    </figure>

    <footer class="bottom-placard">
      <div class="placard-info">
        <div class="script-sub">Taste History</div>
        <div class="details">Private Homes &nbsp;·&nbsp; N10 Garden</div>
      </div>
      <div class="qr-cluster">
        <div class="links">
          <div class="site">epochurian.com</div>
          <div class="handle">@epochurian</div>
        </div>
        <div class="qr">
          <img src="assets/qr-web-dark.svg" alt="Scan for epochurian.com">
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
